<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: "Noto Nastaliq Urdu";
      src: url("file:///usr/share/fonts/truetype/noto/NotoNastaliqUrdu-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Noto Nastaliq Urdu";
      src: url("file:///usr/share/fonts/truetype/noto/NotoNastaliqUrdu-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
    }
    body {
      direction: rtl;
      font-family: "Noto Nastaliq Urdu", serif;
      text-align: center;
    }
    .brand-logo {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 125px;
      object-fit: contain;
      object-position: center;
      z-index: 10;
    }
    .brand-name {
      position: absolute;
      top: 158px;
      left: 0;
      width: 1080px;
      color: rgb(245,235,200);
      font-family: Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      text-align: center;
      z-index: 10;
      text-shadow: 2px 2px 5px rgba(0,0,0,.85);
    }
    .title {
      position: absolute;
      top: 220px;
      left: 170px;
      width: 740px;
      height: 130px;
      color: rgb(245,235,200);
      font-size: 62px;
      font-weight: 700;
      line-height: 1.8;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-wrap;
    }
    .body {
      position: absolute;
      top: 515px;
      left: 125px;
      width: 830px;
      height: 840px;
      color: rgb(250,250,248);
      font-size: 52px;
      font-weight: 400;
      line-height: 2.2;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-wrap;
      overflow: hidden;
      text-shadow: 2px 2px 4px rgba(0,0,0,.8);
    }
    .footer {
      position: absolute;
      top: 1500px;
      left: 210px;
      width: 660px;
      height: 105px;
      color: rgb(225,215,185);
      font-size: 32px;
      line-height: 1.8;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <img class="brand-logo" src="file:///workspace/assets/branding/logo.png" alt="Hidayat Tube logo">
  <div class="brand-name">HIDAYAT TUBE</div>
  <div class="title" id="title">__TITLE__</div>
  <div class="body" id="body">__BODY__</div>
  <div class="footer" id="footer">__FOOTER__</div>
</body>
</html>
