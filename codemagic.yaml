workflows:
  hidayat_ai2_validation:
    name: Hidayat AI 2 - Local Survival Computer validation
    max_build_duration: 30
    environment:
      vars:
        FM_COMPUTER_API: http://127.0.0.1:8080
        OLLAMA_BASE_URL: http://127.0.0.1:11434
        FM_HOME_APPROVAL_REQUIRED: "true"
        YOUTUBE_AUTO_PUBLISH: "false"
    scripts:
      - name: Validate FM AI configuration and discovery
        script: |
          set -e
          test -f hidayat-ai2/README.md
          test -f hidayat-ai2/config/fm-ai.env.example
          test -f hidayat-ai2/scripts/health-check.ps1
          test -f hidayat-ai2/scripts/health-check.sh
          test -f hidayat-ai2/android/settings.gradle.kts
          test -f hidayat-ai2/android/build.gradle.kts
          test -f hidayat-ai2/android/app/build.gradle.kts
          test -f hidayat-ai2/android/app/src/main/java/com/hidayattube/fm_ai/MainActivity.kt
          test -f hidayat-ai2/android/app/src/main/AndroidManifest.xml
          test -f hidayat-ai2/discovery/advertise.py
          test -f hidayat-ai2/discovery/preflight.py
          test -f hidayat-ai2/discovery/requirements.txt
          test -f hidayat-ai2/discovery/start-discovery.ps1
          test -f hidayat-ai2/discovery/start-discovery.sh
          test -f hidayat-ai2/discovery/run-discovery.ps1
          test -f hidayat-ai2/discovery/run-discovery.sh
          test -f hidayat-ai2/discovery/discovery-status.ps1
          test -f hidayat-ai2/discovery/install-discovery.ps1
          test -f hidayat-ai2/discovery/setup-and-start.ps1
          test -f hidayat-ai2/discovery/stop-discovery.ps1
          test -f hidayat-ai2/discovery/setup-and-start.sh
          test -f hidayat-ai2/discovery/stop-discovery.sh
          test -f hidayat-ai2/discovery/README.md
          grep -q 'YOUTUBE_AUTO_PUBLISH=false' hidayat-ai2/config/fm-ai.env.example
          grep -q 'FM_COMPUTER_API=http://127.0.0.1:8080' hidayat-ai2/config/fm-ai.env.example
          grep -q '_fmcomputer._tcp' hidayat-ai2/discovery/advertise.py
          grep -q '_fmcomputer._tcp' hidayat-ai2/discovery/preflight.py
          grep -q 'zeroconf' hidayat-ai2/discovery/requirements.txt
          echo "Hidayat AI 2 configuration: OK"
          echo "Android project structure: OK"
          echo "LAN discovery source and preflight: OK"
          echo "Codemagic role: build/package validation helper only"
          echo "FM Computer runtime remains local"
          echo "YouTube auto-publish remains OFF"
      - name: Android debug build
        script: |
          set -e
          cd hidayat-ai2/android
          if [ -x gradlew ]; then
            ./gradlew assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug
          else
            echo "No Gradle executable available; source/config validation remains complete."
          fi
    artifacts:
      - hidayat-ai2/android/app/build/outputs/**/*.apk
