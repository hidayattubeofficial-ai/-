<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: "Noto Nastaliq Urdu";
      src: url("file:///usr/share/fonts/truetype/noto/NotoNastaliqUrdu-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
    }
    /* Subtle end-card CTA; kept clear of the main Urdu content safe area. */
    .cta {
      position: absolute;
      left: 120px;
      top: 1570px;
      width: 840px;
      height: 78px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(245,235,200);
      font-family: "Noto Nastaliq Urdu", serif;
      font-size: 30px;
      font-weight: 400;
      line-height: 1.55;
      direction: rtl;
      text-align: center;
      white-space: nowrap;
      text-shadow: 2px 2px 4px rgba(0,0,0,.9);
      transform: translate3d(0,0,0);
    }
  </style>
</head>
<body>
  <div class="cta">روزانہ اسلامی یاددہانیوں کے لیے Subscribe کریں۔</div>
</body>
</html>
