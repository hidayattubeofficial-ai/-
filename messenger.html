<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hidayat Tube — GitHub Messenger</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f1e8;margin:0;color:#222}.app{max-width:760px;margin:auto;height:100vh;display:flex;flex-direction:column}.head{background:#173b2b;color:white;padding:16px;font-size:20px;font-weight:700}.sub{font-size:12px;opacity:.8;margin-top:4px}.chat{flex:1;overflow:auto;padding:18px}.msg{background:white;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 2px 8px #0001}.me{border-right:4px solid #2d6a4f}.bot{border-right:4px solid #b0893e}.composer{display:flex;gap:8px;padding:12px;background:white;border-top:1px solid #ddd}.composer textarea{flex:1;resize:none;border:1px solid #ccc;border-radius:12px;padding:10px;font-size:16px}.composer button{border:0;border-radius:12px;background:#173b2b;color:white;padding:0 18px;font-size:16px}</style>
</head>
<body><div class="app"><div class="head">Hidayat Tube — GitHub Messenger<div class="sub">GitHub project control chat • YouTube upload remains OFF until approval</div></div><div id="chat" class="chat"><div class="msg bot">السلام علیکم! یہ آپ کا GitHub Messenger ہے۔ یہاں سے آپ project کے کام، runs، files، errors اور remaining work کے بارے میں پیغام لکھ سکتے ہیں۔</div></div><div class="composer"><textarea id="input" rows="2" placeholder="مثلاً: Run #56 چیک کرو، یا remaining work بتاؤ..."></textarea><button onclick="send()">Send</button></div></div>
<script>function send(){const x=document.getElementById('input');const t=x.value.trim();if(!t)return;const c=document.getElementById('chat');c.insertAdjacentHTML('beforeend',`<div class="msg me">${esc(t)}</div><div class="msg bot">پیغام محفوظ ہے۔ GitHub سے حقیقی جواب لینے کے لیے اسے ChatGPT کے GitHub-connected session میں بھیجیں۔</div>`);x.value='';c.scrollTop=c.scrollHeight}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
