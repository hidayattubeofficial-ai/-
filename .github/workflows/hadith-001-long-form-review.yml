name: Build Hadith 001 Long-Form Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sync and verify official Hadith source
        run: |
          python scripts/sync_hadith_source.py
          test -s library/hadith/sahih-bukhari/sahih-al-bukhari-jild-1.pdf
          test -s library/hadith/sahih-bukhari/source-manifest.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("library/hadith/sahih-bukhari")
          pdf = root / "sahih-al-bukhari-jild-1.pdf"
          manifest = json.loads((root / "source-manifest.json").read_text(encoding="utf-8"))
          actual = hashlib.sha256(pdf.read_bytes()).hexdigest()
          expected = manifest.get("sha256")
          if not expected or actual != expected:
              raise SystemExit("SOURCE_VERIFY_FAILED: SHA-256 manifest mismatch")
          print(f"SOURCE_VERIFY_OK sha256={actual}")
          PY

      - name: Build official-source Hadith 001 review video
        env:
          TTS_VOICE: ur-PK-AsadNeural
          TTS_RATE: -10%
        run: python scripts/build_hadith_long_form.py

      - name: Validate MP4
        run: |
          ffprobe -v error \
            -show_entries format=format_name,duration \
            -show_entries stream=codec_type,codec_name,width,height,pix_fmt,r_frame_rate \
            -of default=noprint_wrappers=1 output/hadith-001-review.mp4

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidayat-hadith-001-long-form-review
          path: |
            output/hadith-001-review.mp4
            output/hadith-001-source.txt
            output/hadith-001-voice.mp3
            library/hadith/sahih-bukhari/source-manifest.json
          retention-days: 90

      - name: Publish guard
        run: |
          echo "YouTube publishing is intentionally OFF."
          echo "Human approval is required before any upload."
