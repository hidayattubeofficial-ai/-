name: Islamic YouTube Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare content package
        run: python scripts/prepare_content.py

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: islamic-content-review
          path: output/

      - name: Review gate
        run: |
          echo "Content package is ready for human review."
          echo "Publishing is intentionally not automatic until references and final content are approved."
