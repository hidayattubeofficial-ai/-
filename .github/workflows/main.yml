name: Islamic YouTube Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg, Urdu TTS, fonts, and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core fonts-noto-cjk fonts-hosny-amiri
          fc-cache -f
          test -f /usr/share/fonts/truetype/noto/NotoNastaliqUrdu-Regular.ttf
          test -f /usr/share/fonts/truetype/noto/NotoNastaliqUrdu-Bold.ttf

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install Playwright Chromium with system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Prepare content package
        run: python scripts/prepare_content.py

      - name: Validate content package
        run: python scripts/validate_content.py

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: islamic-content-review
          path: output/

      - name: Upload video to YouTube as private
        if: ${{ hashFiles('output/video.mp4') != '' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/upload_private_youtube.py

      - name: Review gate
        run: |
          echo "Content package is ready for human review."
          echo "If output/video.mp4 exists, it is uploaded to YouTube as PRIVATE for human review."
          echo "Do not make it public until references and final content are approved."
