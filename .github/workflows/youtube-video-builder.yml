name: Build Hidayat Tube YouTube Video

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Category"
        required: true
        type: choice
        options: [neki, namaz, quran, hadith]
      topic:
        description: "Video topic"
        required: true
        default: "نماز اور دل کا سکون"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TTS_VOICE: ur-PK-AsadNeural
      TTS_RATE: -10%
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Download nature background assets
        run: python scripts/collect_nature_assets.py youtube/backgrounds/nature
      - name: Build branded video
        env:
          VIDEO_CATEGORY: ${{ inputs.category }}
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: |
          rm -rf output
          mkdir -p output
          python scripts/prepare_content.py
      - name: Save permanent story and manifest
        env:
          CATEGORY: ${{ inputs.category }}
        run: |
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p "youtube/stories/$CATEGORY" "youtube/manifests/$CATEGORY"
          cp output/script.md "youtube/stories/$CATEGORY/$stamp.md"
          cp output/metadata.txt "youtube/manifests/$CATEGORY/$stamp.txt"
          git config user.name "hidayattubeofficial-ai"
          git config user.email "hidayattubeofficial@gmail.com"
          git add youtube/stories youtube/manifests
          git diff --cached --quiet || git commit -m "Save YouTube story and manifest [$CATEGORY]"
          git push
      - name: Collect review package
        env:
          CATEGORY: ${{ inputs.category }}
        run: |
          mkdir -p "review/$CATEGORY"
          cp output/video.mp4 "review/$CATEGORY/HidayatTube-$CATEGORY.mp4"
          cp output/voice.mp3 "review/$CATEGORY/voice.mp3"
          cp output/script.md "review/$CATEGORY/script.md"
          cp output/metadata.txt "review/$CATEGORY/metadata.txt"
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidayat-tube-${{ inputs.category }}-review
          path: review/${{ inputs.category }}/
          retention-days: 90
      - name: Publish guard
        run: |
          echo "YouTube publishing is intentionally OFF."
          echo "Human approval is required before any upload."
