name: Deploy Hidayat Technology Worker

on:
  push:
    branches: [main]
    paths:
      - "technology-worker/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: technology-worker
          wranglerVersion: "4.81.0"
          command: deploy
# Technology Worker deployment path.
