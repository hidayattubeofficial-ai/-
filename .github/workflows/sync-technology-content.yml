name: Sync Technology Content to Website

on:
  push:
    branches: [main]
    paths:
      - 'technology-content/posts/**'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub content
        uses: actions/checkout@v4

      - name: Sync posts to Cloudflare D1
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: b5a79281-a65f-40e5-9b8b-5dcc4459fc74
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          account=os.environ["CF_ACCOUNT_ID"]
          token=os.environ["CF_API_TOKEN"]
          db=os.environ["D1_DATABASE_ID"]
          base=f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query"
          headers={"Authorization":f"Bearer {token}","Content-Type":"application/json"}
          files=sorted(pathlib.Path("technology-content/posts").glob("*.json"))
          if not files:
              print("No content files found")
              raise SystemExit(0)
          for p in files:
              x=json.loads(p.read_text())
              sql="""INSERT INTO posts(category_id,title,slug,excerpt,content,status,published_at,updated_at)
              VALUES((SELECT id FROM categories WHERE slug=?),?,?,?,?, 'published',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP)
              ON CONFLICT(slug) DO UPDATE SET
                category_id=excluded.category_id,title=excluded.title,excerpt=excluded.excerpt,
                content=excluded.content,status='published',updated_at=CURRENT_TIMESTAMP"""
              params=[x["category_slug"],x["title"],x["slug"],x.get("excerpt",""),x["content"]]
              req=urllib.request.Request(base,data=json.dumps({"sql":sql,"params":params}).encode(),headers=headers,method="POST")
              with urllib.request.urlopen(req) as r:
                  out=json.load(r)
              if not out.get("success"):
                  raise RuntimeError(f"{p}: {out}")
              print(f"Synced {p}")
          PY
